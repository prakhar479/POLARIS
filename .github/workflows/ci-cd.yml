name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, '**' ]
  pull_request:
    branches: [ main, develop ]
  merge_group:
    branches: [ main, develop ]

jobs:
  test-and-format:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.POLARIS_PAT || github.token }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install pytest-cov

    - name: Verify installation
      run: |
        python -c "import polaris; print('POLARIS imported successfully')"
        pytest --version

    - name: Run Black formatting
      run: |
        black --check --diff --line-length=100 polaris/ tests/ examples/
      continue-on-error: false

    - name: Run isort import sorting
      run: |
        isort --check-only --diff --profile=black --line-length=100 polaris/ tests/ examples/
      continue-on-error: false

    - name: Run mypy type checking
      run: |
        mypy polaris/ --ignore-missing-imports
      continue-on-error: false

    - name: Run pytest with coverage
      run: |
        pytest tests/ -v --cov=polaris --cov-report=xml --cov-report=term-missing --cov-fail-under=40

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Check for formatting changes
      id: check-format
      run: |
        # Check if any files need formatting
        if ! black --check --diff --line-length=100 polaris/ tests/ examples/ 2>/dev/null; then
          echo "needs_formatting=true" >> $GITHUB_OUTPUT
        else
          echo "needs_formatting=false" >> $GITHUB_OUTPUT
        fi

        if ! isort --check-only --diff --profile=black --line-length=100 polaris/ tests/ examples/ 2>/dev/null; then
          echo "needs_import_sorting=true" >> $GITHUB_OUTPUT
        else
          echo "needs_import_sorting=false" >> $GITHUB_OUTPUT
        fi

    - name: Auto-format code
      if: github.event_name == 'push' && (steps.check-format.outputs.needs_formatting == 'true' || steps.check-format.outputs.needs_import_sorting == 'true')
      run: |
        # Format the code
        black --line-length=100 polaris/ tests/ examples/
        isort --profile=black --line-length=100 polaris/ tests/ examples/

        # Configure git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Add and commit formatting changes
        git add polaris/ tests/ examples/
        git diff --staged --quiet || git commit -m "auto: format code [skip ci]"

        # Push changes back to branch
        git push

    - name: Run integration tests (if any)
      run: |
        if [ -d "tests/integration" ]; then
          pytest tests/integration/ -v --cov=polaris --cov-append
        fi

    - name: Validate package build
      run: |
        python -m build --wheel --sdist .
        twine check dist/*

  quality-check:
    runs-on: ubuntu-latest
    needs: test-and-format
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run comprehensive quality checks
      run: |
        # Check for TODO/FIXME comments
        grep -r "TODO\|FIXME" polaris/ --include="*.py" || echo "No TODO/FIXME found"

        # Check for print statements (should use logging)
        grep -r "print(" polaris/ --include="*.py" | grep -v "test_" || echo "No print statements found"

        # Validate docstring coverage
        python -c "
        import ast
        import os
        from pathlib import Path

        def check_docstrings(directory):
            missing_docs = []
            for py_file in Path(directory).rglob('*.py'):
                if 'test_' in py_file.name or '__pycache__' in str(py_file):
                    continue
                try:
                    with open(py_file, 'r') as f:
                        tree = ast.parse(f.read())
                    for node in ast.walk(tree):
                        if isinstance(node, (ast.FunctionDef, ast.ClassDef)):
                            if not ast.get_docstring(node):
                                missing_docs.append(f'{py_file}:{node.name}')
                except:
                    pass
            return missing_docs

        missing = check_docstrings('polaris')
        if missing:
            print(f'Missing docstrings: {len(missing)}')
            for item in missing[:10]:
                print(f'  {item}')
        else:
            print('All functions/classes have docstrings')
        "

    - name: Performance regression check
      run: |
        if [ -f "benchmarks/run_benchmarks.py" ]; then
          pip install pytest-benchmark
          pytest benchmarks/ --benchmark-only --benchmark-json=benchmark.json
        else
          echo "No benchmarks found"
        fi

  deploy-docs:
    runs-on: ubuntu-latest
    needs: [test-and-format, quality-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install sphinx sphinx-rtd-theme

    - name: Build documentation
      run: |
        if [ -d "docs" ]; then
          cd docs
          make html
        else
          echo "No docs directory found"
        fi
