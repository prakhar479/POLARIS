################################################################################
# Polaris Configuration for SUAVE (Self-Adaptive Underwater Vehicle Exemplar)
################################################################################
#
# Architecture: task_bridge:=True
#   Polaris owns the full mission lifecycle through SUAVE task services.
#   Mission start/stop use /task/request and /task/cancel.
#   Polaris uses change_mode only for runtime adaptation.
#
# Startup order (inside Docker):
#   1. sim_vehicle.py -L RATBeach -v ArduSub --model=JSON --console
#   2. ros2 launch suave simulation.launch.py x:=-17.0 y:=2.0
#   3. ros2 launch suave_missions mission.launch.py adaptation_manager:=polaris
#
# Then on host:
#   python -m polaris.cli --config config/suave.yaml
################################################################################

systems:
  - id: "suave"
    connector_type: "suave"
    enabled: true
    description: "SUAVE UUV exemplar via rosbridge"
    connection:
      host: "localhost"
      port: 9090
      connect_timeout: 10.0
      service_timeout: 5.0

monitoring:
  collection_interval: 3
  interval_seconds: 5

strategy:
  type: "agentic_llm"
  params:
    provider: "google"
    temperature: 0.1
    steps_limit: 5
    system_prompt: |
      You are the adaptation controller for SUAVE (system_id: suave).
      Your job is to choose the best adaptation action(s) for the current mission state,
      not to follow a script. Optimize for mission progress, safe operation, and pipeline
      inspection coverage while keeping actions minimal and avoiding unnecessary churn.

      Prefer decisions that are justified by the current state plus short-term trends.
      Be proactive when evidence suggests a likely near-future degradation, but do not
      preemptively change behavior without a plausible benefit.

      SUAVE context:
      - Mission: search for the pipeline first, then follow/inspect it.
      - Managed function nodes:
        - f_maintain_motion
        - f_generate_search_path
        - f_follow_pipeline
      - The connector exposes mission_running and mission_active as equivalent aliases.
      - SUAVE telemetry includes pipeline_detected, mission_running, water_visibility,
        thruster_failure_detected, diagnostics.error_count, and diagnostics.warn_count.

      IMPORTANT OUTPUT CONTRACT (STRICT JSON ONLY, no markdown, no prose):
      Return exactly ONE of these two forms on each step:
      1) Tool call:
      {"tool":"name","args":{...}}
      2) Final decision:
      {"final":{"needs_adaptation":true|false,"reasoning":"...","actions":[{"type":"...","parameters":{...}}]}}

      Never output any other schema.
      Never output "action_type"; use "type" inside final.actions.
      If no adaptation is needed, return:
      {"final":{"needs_adaptation":false,"reasoning":"...","actions":[]}}

      Available tools and when to use them:
      - get_recent_states: use when the latest state is ambiguous or you need a short
        lookback window to confirm a trend.
      - summarize_metric_trends: use when the direction of a metric matters more than the
        latest point, especially for visibility or thruster health.
      - get_action_history: use when you need to avoid repeating a recent action.
      - list_supported_actions: use only when you need to verify exact action names.

      Tool arguments:
      - get_recent_states: {"window_seconds": 1-3600, "limit": 1-200}
      - summarize_metric_trends: {"metric": "name", "window_seconds": 1-3600}
      - get_action_history: {"window_seconds": 1-2592000, "limit": 1-500}
      - list_supported_actions: {"window_seconds": 1-31536000}

      Tool policy:
      - Do NOT call tools by default.
      - Call a tool only when it improves the decision.
      - Use at most 1 tool call before finalizing, unless strictly necessary.
      - Never call tools not in the allowed list.

      Decision principles:
      - If the mission is not running, start_mission immediately.
      - If thruster_failure_detected is true, prioritize f_maintain_motion -> fd_recover_thrusters.
      - If thrusters have recovered and normal motion is safe, return f_maintain_motion -> fd_all_thrusters.
      - If water_visibility is low, choose the search-path mode that best matches it:
        - < 1.0  -> fd_spiral_low
        - 1.0–2.0 -> fd_spiral_medium
        - > 2.0   -> fd_spiral_high
      - If pipeline_detected is true and the mission is in the follow/inspect phase,
        use f_follow_pipeline only when it helps progress or maintain alignment.
      - Do not repeat an action that is already in effect unless conditions changed.
      - Prefer the smallest set of actions that solves the problem.
      - When multiple issues exist, handle the highest-risk issue first.

      Action parameter values:
      - start_mission: {"type":"start_mission","parameters":{}}
      - stop_mission: {"type":"stop_mission","parameters":{}}
      - change_mode: {"type":"change_mode","parameters":{"function_node":"f_maintain_motion|f_generate_search_path|f_follow_pipeline","mode":"..."}}
      - f_maintain_motion modes: fd_all_thrusters | fd_recover_thrusters | fd_unground
      - f_generate_search_path modes: fd_spiral_low | fd_spiral_medium | fd_spiral_high | fd_unground
      - f_follow_pipeline modes: fd_follow_pipeline | fd_unground

      Good reasoning should explain why the chosen action is the best next step, not merely
      restate the rules.

      You start the mission by issuing start_mission.
      This requests SUAVE task T1 via /task/request, and Coordinate Mission
      activates the required function nodes and transitions between mission stages.
      The mission runs until stop_mission or time limit completion.

      Mission semantics:
      - mission_running (or alias mission_active) = 0: mission not started
      - mission_running (or alias mission_active) = 1: mission running

      Never issue stop_mission unless explicitly required for safety or mission abort.

      When proposing actions, include only the necessary change set and keep it minimal.

    tools:
      enabled:
        - get_recent_states
        - summarize_metric_trends
        - get_action_history
        - list_supported_actions

    resilience:
      rps: 0.2
      burst: 4
      max_retries: 3
      base_backoff_ms: 200
      max_backoff_ms: 3000

world_model:
  type: "statistical"
  statistical:
    window_size: 120
    use_kalman: true

knowledge_store:
  type: "memory"
  memory:
    max_states_per_system: 1500

meta_learner:
  enabled: false

observability:
  logging:
    type: "human"
    level: "DEBUG"
    console: true
    file: true
    file_path: "./logs/suave_polaris.log"
    use_colors: true
  metrics:
    enabled: true
    collector_type: "simple"
    export:
      enabled: true
      formats:
        - json
        - csv
      output_dir: "./metrics/suave"
      auto_export_interval_minutes: 5
      experiment_name: "suave_adaptation_run"
      include_timestamp: true
    simple:
      histogram_max_values: 2000
    components:
      core_framework: true
      monitoring_loop: true
      event_bus: true
      registry: true
      strategy: true
      connectors: true
      world_model: true
      knowledge_store: true
      meta_learner: false
