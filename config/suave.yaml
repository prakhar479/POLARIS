################################################################################
# Polaris Configuration for SUAVE (Self-Adaptive Underwater Vehicle Exemplar)
################################################################################
#
# Architecture: adaptation_manager:=polaris (task_bridge:=True)
#   Polaris owns the full mission lifecycle through SUAVE task services.
#   Mission start/stop use /task/request and /task/cancel.
#   Polaris uses change_mode only for runtime adaptation.
#
# Startup order (inside Docker, via VNC at http://localhost:6901):
#   1. sim_vehicle.py -L RATBeach -v ArduSub --model=JSON --console
#   2. ros2 launch suave simulation.launch.py x:=-17.0 y:=2.0
#   3. ros2 launch suave_missions mission.launch.py \
#          adaptation_manager:=polaris \
#          mission_type:=time_constrained_mission \
#          result_filename:=polaris_run_1
#
# Then on host:
#   python -m polaris.cli --config config/suave.yaml
#
# SUAVE mission parameters (from mission_config.yaml in container):
#   time_limit:              300 s
#   water_visibility period: 80 s   (sinusoidal, min=1.25 m, max=3.75 m)
#   thruster failure:        thruster 1 fails at t=35 s from GUIDED mode
#
# Altitude thresholds from suave_modes.yaml:
#   fd_spiral_high   → spiral_altitude: 3.0 m  (needs visibility >= 3.25)
#   fd_spiral_medium → spiral_altitude: 2.0 m  (needs visibility >= 2.25)
#   fd_spiral_low    → spiral_altitude: 1.0 m  (needs visibility >= 1.25)
#
# Performance target: beat Metacontrol baseline
#   Metacontrol (20 runs): search_time_mean=106.95s, distance_inspected_mean=51.15m
#   Target: search_time < 100s mean, distance_inspected > 55m mean
################################################################################

systems:
  - id: "suave"
    connector_type: "suave"
    enabled: true
    description: "SUAVE UUV exemplar via rosbridge"
    connection:
      host: "localhost"
      port: 9090
      connect_timeout: 15.0
      # Service timeout: 10s for task services (they can be slow at sim startup)
      service_timeout: 10.0

monitoring:
  # collection_interval: how often per-system telemetry is collected (seconds).
  # Water visibility is published at 1 Hz; thruster events are instant.
  # 2 s gives fresh readings while keeping LLM call frequency sane.
  collection_interval: 2
  interval_seconds: 2

strategy:
  type: "agentic_llm"
  params:
    provider: "google"
    temperature: 0.05
    decision_cooldown_seconds: 20
    steps_limit: 3
    system_prompt: |
      You are POLARIS, the adaptation controller for SUAVE (AUV pipeline inspection, system_id: suave).
      Output STRICT JSON only — no markdown. Exactly one of:
        Tool:  {"tool":"<name>","args":{...}}
        Final: {"final":{"needs_adaptation":true|false,"reasoning":"<brief>","actions":[{"type":"<t>","parameters":{...}}]}}

      METRICS IN current_state.metrics:
        mission_running [0|1], pipeline_detected [0|1], water_visibility [m],
        water_visibility_age_s, thruster_failure_detected [0|1], diagnostics.error_count

      ALTITUDE → MODE (T1 only; always use highest supportable):
        wv>=3.25: fd_spiral_high | wv>=2.25: fd_spiral_medium | else: fd_spiral_low

      DECIDE IN THIS ORDER — stop at first match:
        1. mission_running=0  → {"type":"start_mission","parameters":{}}
        2. thruster_failure_detected=1 → change_mode f_maintain_motion fd_recover_thrusters
           (may combine with a visibility change in the same actions[] list)
        3. thruster_failure_detected=0 AND fd_recover_thrusters was last sent
           → call get_action_history to confirm, then fd_all_thrusters
        4. pipeline_detected=0: compute optimal mode from wv.
           If wv is falling toward next lower threshold, call summarize_metric_trends
           (avg>current means falling). Switch proactively before threshold is crossed.
           If already in optimal mode → skip.
        5. No match → needs_adaptation=false

      VALID change_mode:
        f_maintain_motion: fd_all_thrusters | fd_recover_thrusters | fd_unground
        f_generate_search_path: fd_spiral_low | fd_spiral_medium | fd_spiral_high | fd_unground
        f_follow_pipeline: fd_follow_pipeline | fd_unground

      TOOLS:
        {"tool":"summarize_metric_trends","args":{"metric":"water_visibility","window_seconds":30}}
        {"tool":"get_action_history",   "args":{"window_seconds":120,"limit":10}}
        {"tool":"get_recent_states",    "args":{"window_seconds":20,"limit":5}}
        Rules: max 1 tool/cycle. Tool name must be exact — NEVER append parameter names to tool name.

    tools:
      enabled:
        - get_recent_states
        - summarize_metric_trends
        - get_action_history

    resilience:
      rps: 0.2
      burst: 4
      max_retries: 3
      base_backoff_ms: 200
      max_backoff_ms: 3000

world_model:
  type: "statistical"
  statistical:
    window_size: 120
    use_kalman: true

knowledge_store:
  type: "memory"
  memory:
    max_states_per_system: 2000

meta_learner:
  enabled: false

observability:
  logging:
    type: "human"
    level: "DEBUG"
    console: true
    file: true
    file_path: "./logs/suave_polaris.log"
    use_colors: true
  metrics:
    enabled: true
    collector_type: "simple"
    export:
      enabled: true
      formats:
        - json
        - csv
      output_dir: "./metrics/suave"
      auto_export_interval_minutes: 2
      experiment_name: "suave_polaris_run"
      include_timestamp: true
    simple:
      histogram_max_values: 2000
    components:
      core_framework: true
      monitoring_loop: true
      event_bus: true
      registry: true
      strategy: true
      connectors: true
      world_model: true
      knowledge_store: true
      meta_learner: false
