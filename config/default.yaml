# Polaris Framework Configuration
# Simple example configuration

# Managed Systems
systems:
  - id: "swim"
    connector_type: "swim"
    enabled: true
    connection:
      host: "localhost"
      port: 4242
    monitoring:
      collection_interval: 5 # seconds

# Monitoring Configuration
monitoring:
  interval_seconds: 30 # How often to run the monitoring loop

# Adaptation Strategy
strategy:
  type: "threshold" # Options: threshold, llm_reasoning, hybrid

  # Threshold Strategy Settings
  threshold:
    thresholds:
      cpu_usage:
        high: 80.0
        low: 20.0
      average_utilization:
        high: 85.0
        low: 25.0
      average_response_time:
        high: 500.0 # milliseconds

    cooldown_seconds: 60
    enabled: true

  # LLM Reasoning Strategy Settings (uncomment to use)
  llm_reasoning:
    system_description: "SWIM web application server pool"
    adaptation_goals: "Maintain performance with minimal resource usage"
    temperature: 0.1
    # resilience:
    #   rps: 2
    #   burst: 4
    #   concurrency: 4
    #   max_retries: 4
    #   base_backoff_ms: 200
    #   max_backoff_ms: 4000
    #   # keys_env_var: OPENAI_API_KEYS  # optional custom env var for key rotation

  # hybrid:
  #   selection_mode: confidence
  #   min_confidence: 0.7
  #   strategies:
  #     - type: threshold
  #       priority: 0.8
  #       threshold:
  #         thresholds:
  #           cpu_usage: { high: 80.0, low: 20.0 }
  #         cooldown_seconds: 45
  #     - type: llm_reasoning
  #       priority: 0.6
  #       llm_reasoning:
  #         system_description: "SWIM web application server pool"
  #         adaptation_goals: "Maintain performance with minimal resource usage"
  #         temperature: 0.1
  #         resilience:
  #           rps: 2
  #           burst: 4
  #           max_retries: 4
  #           base_backoff_ms: 200
  #           max_backoff_ms: 4000
  #           concurrency: 4

# World Model (optional)
world_model:
  type: "statistical"
  statistical:
    # Number of recent samples to keep per metric in memory
    window_size: 100
    # Enable lightweight Kalman-style filtering for smoother predictions
    # and a variance-based confidence score. When false, the model uses
    # simple historical means.
    use_kalman: true

    # Simple regime tracking (HMM-style) is always enabled for the
    # statistical world model. Regimes ("low", "normal", "high") are
    # inferred from metrics such as cpu_usage/response_time and are
    # exposed via world_model.get_insights() and the PredictionResult
    # reasoning string.

# Knowledge Store (optional)
knowledge:
  type: "memory"
  memory:
    max_states_per_system: 1000

# Meta-Learner (optional, enabled here for demonstration)
meta_learner:
  enabled: true
  type: "statistical"
  analysis_interval_hours: 0.01
  conservative_mode: true
  # When a statistical world model is provided to Polaris, the
  # StatisticalMetaLearner automatically consumes its insights via
  # world_model.get_insights(). The meta-learner aggregates basic
  # uncertainty information (e.g., average metric std and regime
  # estimates) into analysis.insights["world_model_uncertainty"], and
  # uses this to slightly adjust proposal confidence (more cautious
  # when variability is high).

# Observability
observability:
  logging:
    type: "human" # Options: "structured" (JSON), "human" (readable)
    level: "DEBUG" # DEBUG, INFO, WARNING, ERROR
    console: true
    file: true
    file_path: "./logs/polaris.log"
    use_colors: true # For human-readable format (console only)

  metrics:
    enabled: true
    collector_type: "simple" # Options: "simple", "prometheus", "datadog"

    # Export settings
    export:
      enabled: false
      formats: ["json", "csv"] # Available: json, csv
      output_dir: "./metrics"
      auto_export_interval_minutes: 60 # 0 to disable auto-export
      experiment_name: null # Optional experiment identifier
      include_timestamp: true

    # Simple collector settings
    simple:
      histogram_max_values: 1000 # Max values to keep in histograms

    # Framework component metrics (can be disabled individually)
    components:
      core_framework: true # Main Polaris lifecycle metrics
      monitoring_loop: true # Monitoring loop performance
      event_bus: true # Event system metrics
      registry: true # Component registry metrics
      strategy: true # Strategy-specific metrics
      connectors: true # Connector operation metrics
      world_model: true # World model metrics
      knowledge_store: true # Knowledge store metrics
      meta_learner: true # Meta-learner metrics (when enabled)
