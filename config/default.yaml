# Polaris Framework Configuration
# Simple example configuration

# Managed Systems
systems:
  - id: "swim"
    connector_type: "swim"
    enabled: true
    connection:
      host: "localhost"
      port: 4242
    monitoring:
      collection_interval: 5 # seconds

  - id: "wildfire"
    connector_type: "wildfire"
    enabled: true
    connection:
      host: "localhost"
      port: 5000        # or use base_url: "http://localhost:5000"
      timeout: 10.0

# Monitoring Configuration
monitoring:
  interval_seconds: 30 # How often to run the monitoring loop

# Adaptation Strategy
strategy:
  type: "threshold" # Options: threshold, llm_reasoning, hybrid, agentic_llm

  # Threshold Strategy Settings
  threshold:
    thresholds:
      cpu_usage:
        high: 80.0
        low: 20.0
      average_utilization:
        high: 85.0
        low: 25.0
      average_response_time:
        high: 500.0 # milliseconds
    # thresholds:
    #   fire_cells_burning_ratio:
    #     high: 70.0
    #     low: 10.0
    #   mr1_avg:
    #     low: 0.2

    cooldown_seconds: 60
    enabled: true

  # LLM Reasoning Strategy Settings (uncomment to use)
  llm_reasoning:
    system_description: "SWIM web application server pool"
    adaptation_goals: "Maintain performance with minimal resource usage"
    temperature: 0.1
    provider: google  # Options: google (default), openai
    # Optional: global system prompt template (supports {system_id}, {system_description}, {adaptation_goals})
    # system_prompt: |
    #   You are an intelligent adaptation controller for a self-adaptive system.
    #   System Description: {system_description}
    #   Adaptation Goals: {adaptation_goals}
    #   Managed System ID: {system_id}
    #   ...
    #
    # Optional: per-system prompt overrides keyed by systems[].id (e.g. "swim", "wildfire")
    # per_system_prompts:
    #   swim: |
    #     You are an adaptation controller for the SWIM web application server pool.
    #     Focus on response time, throughput, and server utilization when deciding
    #     whether to scale up/down or adjust QoS dimmer settings.
    #   wildfire: |
    #     You are an adaptation controller for the Wildfire UAV-fire simulation.
    #     Focus on fire_cells_burning_ratio, mr1_avg, and safety metrics when
    #     deciding which wildfire_* actions to trigger.
    #
    # resilience:
    #   rps: 2
    #   burst: 4
    #   concurrency: 4
    #   max_retries: 4
    #   base_backoff_ms: 200
    #   max_backoff_ms: 4000
    #   # keys_env_var: OPENAI_API_KEYS  # optional custom env var for key rotation

  # hybrid:
  #   selection_mode: confidence
  #   min_confidence: 0.7
  #   strategies:
  #     - type: threshold
  #       priority: 0.8
  #       threshold:
  #         thresholds:
  #           cpu_usage: { high: 80.0, low: 20.0 }
  #         cooldown_seconds: 45
  #     - type: llm_reasoning
  #       priority: 0.6
  #       llm_reasoning:
  #         system_description: "SWIM web application server pool"
  #         adaptation_goals: "Maintain performance with minimal resource usage"
  #         temperature: 0.1
  #         provider: openai
  #         # Optional: system_prompt / per_system_prompts as in top-level llm_reasoning
  #         # system_prompt: | 
  #         #   ...
  #         # per_system_prompts:
  #         #   swim: |
  #         #     ...
  #         #   wildfire: |
  #         #     ...
  #         resilience:
  #           rps: 2
  #           burst: 4
  #           max_retries: 4
  #           base_backoff_ms: 200
  #           max_backoff_ms: 4000
  #           concurrency: 4

  # Agentic LLM Strategy Settings (uncomment to use)
  # agentic_llm:
  #   provider: google  # or "openai"
  #   steps_limit: 3
  #   temperature: 0.1
  #   tools:
  #     enabled:
  #       - get_recent_states
  #       - summarize_metric_trends
  #       - get_world_model_insights
  #       - predict_outcome
  #       - get_action_history
  #       - list_supported_actions  # connector-aware when supported
  #   resilience:
  #     rps: 2
  #     burst: 4
  #     concurrency: 4
  #     max_retries: 4
  #     base_backoff_ms: 200
  #     max_backoff_ms: 4000

# World Model (optional)
world_model:
  type: "statistical"
  statistical:
    # Number of recent samples to keep per metric in memory
    window_size: 100
    # Enable lightweight Kalman-style filtering for smoother predictions
    # and a variance-based confidence score. When false, the model uses
    # simple historical means.
    use_kalman: true

    # Simple regime tracking (HMM-style) is always enabled for the
    # statistical world model. Regimes ("low", "normal", "high") are
    # inferred from metrics such as cpu_usage/response_time and are
    # exposed via world_model.get_insights() and the PredictionResult
    # reasoning string.

# Knowledge Store (optional)
knowledge:
  type: "memory"
  memory:
    max_states_per_system: 1000

# Meta-Learner (optional, enabled here for demonstration)
meta_learner:
  enabled: true
  type: "statistical"
  analysis_interval_hours: 0.01
  conservative_mode: true
  # When a statistical world model is provided to Polaris, the
  # StatisticalMetaLearner automatically consumes its insights via
  # world_model.get_insights(). The meta-learner aggregates basic
  # uncertainty information (e.g., average metric std and regime
  # estimates) into analysis.insights["world_model_uncertainty"], and
  # uses this to slightly adjust proposal confidence (more cautious
  # when variability is high).

  # Example: LLM-based meta-learner (alternative to statistical)
  # type: "llm"
  # analysis_interval_hours: 1.0
  # llm:
  #   provider: google  # or "openai"
  #   temperature: 0.1
  #   auto_apply: false  # whether to auto-apply approved proposals
  #
  #   # Optional: global analysis/optimization prompts
  #   # analysis_system_prompt: |
  #   #   You are an expert system analyst for self-adaptive systems...
  #   # optimization_system_prompt: |
  #   #   You are an expert parameter optimizer for self-adaptive systems...
  #   #
  #   # Optional: per-system prompt overrides keyed by systems[].id (e.g. "swim", "wildfire")
  #   # per_system_prompts:
  #   #   swim:
  #   #     analysis_system_prompt: |
  #   #       Analyze SWIM-specific performance metrics (response time, throughput, utilization)...
  #   #     optimization_system_prompt: |
  #   #       Propose threshold and cooldown changes for SWIM's adaptation strategy...
  #   #   wildfire:
  #   #     analysis_system_prompt: |
  #   #       Analyze Wildfire-specific metrics (fire_cells_burning_ratio, mr1_avg, safety)...
  #   #     optimization_system_prompt: |
  #   #       Propose parameter changes that balance fire containment and UAV safety...
  #   #
  #   # resilience:
  #   #   rps: 2
  #   #   burst: 4
  #   #   concurrency: 4
  #   #   max_retries: 4
  #   #   base_backoff_ms: 200
  #   #   max_backoff_ms: 4000

# Observability
observability:
  logging:
    type: "human" # Options: "structured" (JSON), "human" (readable)
    level: "DEBUG" # DEBUG, INFO, WARNING, ERROR
    console: true
    file: true
    file_path: "./logs/polaris.log"
    use_colors: true # For human-readable format (console only)

  metrics:
    enabled: true
    collector_type: "simple" # Options: "simple", "prometheus", "datadog"

    # Export settings
    export:
      enabled: false
      formats: ["json", "csv"] # Available: json, csv
      output_dir: "./metrics"
      auto_export_interval_minutes: 60 # 0 to disable auto-export
      experiment_name: null # Optional experiment identifier
      include_timestamp: true

    # Simple collector settings
    simple:
      histogram_max_values: 1000 # Max values to keep in histograms

    # Framework component metrics (can be disabled individually)
    components:
      core_framework: true # Main Polaris lifecycle metrics
      monitoring_loop: true # Monitoring loop performance
      event_bus: true # Event system metrics
      registry: true # Component registry metrics
      strategy: true # Strategy-specific metrics
      connectors: true # Connector operation metrics
      world_model: true # World model metrics
      knowledge_store: true # Knowledge store metrics
      meta_learner: true # Meta-learner metrics (when enabled)
