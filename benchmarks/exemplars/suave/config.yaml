################################################################################
# Polaris Configuration for SUAVE (Self-Adaptive Underwater Vehicle Exemplar)
################################################################################
#
# Architecture: adaptation_manager:=polaris (task_bridge:=True)
#   Polaris owns the full mission lifecycle through SUAVE task services.
#   Mission start/stop use /task/request and /task/cancel.
#   Polaris must start the mission first, then uses change_mode only for runtime adaptation.
#
# Startup order (inside Docker, via VNC at http://localhost:6901):
#   1. sim_vehicle.py -L RATBeach -v ArduSub --model=JSON --console
#   2. ros2 launch suave simulation.launch.py x:=-17.0 y:=2.0
#   3. ros2 launch suave_missions mission.launch.py \
#          adaptation_manager:=polaris \
#          mission_type:=time_constrained_mission \
#          result_filename:=polaris_run_1
#
# Then on host:
#   python -m polaris.cli --config config/suave.yaml
#
# SUAVE mission parameters (from mission_config.yaml in container):
#   time_limit:              300 s
#   water_visibility period: 80 s   (sinusoidal, min=1.25 m, max=3.75 m)
#   thruster failure:        thruster 1 fails at t=35 s from GUIDED mode
#
# Altitude thresholds from suave_modes.yaml:
#   fd_spiral_high   → spiral_altitude: 3.0 m  (needs visibility >= 3.25)
#   fd_spiral_medium → spiral_altitude: 2.0 m  (needs visibility >= 2.25)
#   fd_spiral_low    → spiral_altitude: 1.0 m  (needs visibility >= 1.25)
#
# Performance target: beat Metacontrol baseline
#   Metacontrol (20 runs): search_time_mean=106.95s, distance_inspected_mean=51.15m
#   Target: search_time < 100s mean, distance_inspected > 55m mean
################################################################################

systems:
  - id: "suave"
    connector_type: "suave"
    enabled: true
    description: "SUAVE UUV exemplar via rosbridge"
    connection:
      host: "localhost"
      port: 9090
      connect_timeout: 15.0
      # Service timeout: 10s for task services (they can be slow at sim startup)
      service_timeout: 10.0

monitoring:
  # collection_interval: how often per-system telemetry is collected (seconds).
  # Water visibility is published at 1 Hz; thruster events are instant.
  # 2 s gives fresh readings while keeping LLM call frequency sane.
  collection_interval: 2
  interval_seconds: 2

strategy:
  type: "agentic_llm"
  params:
    provider: "groq"
    temperature: 0.2
    decision_cooldown_seconds: 20
    steps_limit: 3
    # Optional meta-learner observations appended to the live agentic prompt.
    system_prompt_suffix: ""
    system_prompt: |
      You are the adaptation controller for SUAVE, an autonomous underwater vehicle inspecting a seabed pipeline. You receive telemetry each cycle and decide whether to adapt the system. Reason carefully and act intelligently, not just reactively.

      System context:
      - f_maintain_motion handles thruster health; valid modes: fd_all_thrusters, fd_recover_thrusters
      - f_generate_search_path controls the spiral search pattern; valid modes: fd_spiral_low (altitude 1m), fd_spiral_medium (2m), fd_spiral_high (3m)
      - f_follow_pipeline follows the detected pipeline; valid mode: fd_follow_pipeline
      - Water visibility drives search altitude: higher visibility allows higher spirals that cover more area faster.
      - Thruster failures reduce maneuverability.

      Metrics available each cycle:
      - mission_running: 1 if mission is active, 0 if not started
      - mission_active: alias of mission_running; treat exactly the same
      - pipeline_detected: 1 if pipeline found, 0 if still searching
      - water_visibility: current visibility in metres (range ~1 to ~4)
      - thruster_failure_detected: 1 if any thruster has failed
      - diagnostics.error_count: number of ERROR level diagnostics

      Intelligence principles:
      - Startup has highest priority: if mission_running or mission_active == 0, issue start_mission(search_pipeline) immediately before any other action.
      - Do not issue change_mode while the mission is not running; startup comes first.
      - After issuing start_mission, avoid repeating it every cycle while startup is still converging; only retry after a short delay if mission stays at 0.
      - Thruster failure is urgent; recover immediately, do not delay.
      - After recovery is confirmed, restore fd_all_thrusters to maximise speed.
      - Match spiral altitude to visibility proactively: if visibility is falling toward a threshold, switch before it crosses, not after.
      - Visibility thresholds: >= 3.25m → high, >= 2.25m → medium, else → low.
      - Avoid oscillating between modes; only switch if visibility has clearly moved into a new band and is not just noise at the boundary.
      - If pipeline is detected, f_follow_pipeline is handled automatically; focus adaptation on maintaining motion quality and search efficiency.
      - Do not issue redundant actions; check action history before repeating.

      Response instructions:
      - Call start_mission with task=search_pipeline when the mission is not yet running.
      - Call change_mode to adapt the system, specifying function_node, mode, and reasoning.
      - Call no_adaptation when the system is already in the correct state.
      - You may call at most one Polaris analysis tool per cycle: get_recent_states, summarize_metric_trends, get_action_history.
      - Do not invent mode names or function node names not listed above.
      - Do not hallucinate missing telemetry; if data is missing, state uncertainty in reasoning.

    tools:
      enabled:
        - get_recent_states
        - summarize_metric_trends
        - get_action_history

    # Native tool calling (OpenAI function-calling format).
    # When this section is present, the LLM receives these function definitions and
    # must respond by calling one of them instead of producing a JSON text response.
    # Providers convert this OpenAI-format schema internally to their native
    # tool-calling format; strategy logic stays provider-agnostic.
    #
    # The two functions cover all SUAVE adaptation decisions:
    #   - get_recent_states / summarize_metric_trends / get_action_history:
    #       Polaris-native analysis tools that can be called before final action selection
    #   - start_mission: request the pipeline inspection mission through /task/request
    #   - change_mode: issue a mode change to a SUAVE function node
    #   - no_adaptation: signal that no changes are needed this cycle
    native_tools:
      - type: "function"
        function:
          name: "get_recent_states"
          description: >
            Query recent system states from Polaris knowledge store.
          parameters:
            type: "object"
            properties:
              window_seconds:
                type: "integer"
                minimum: 1
                maximum: 3600
                description: "Lookback window in seconds."
              limit:
                type: "integer"
                minimum: 1
                maximum: 200
                description: "Maximum number of recent states to return."

      - type: "function"
        function:
          name: "summarize_metric_trends"
          description: >
            Summarize recent trends for one metric from Polaris knowledge store.
          parameters:
            type: "object"
            properties:
              metric:
                type: "string"
                description: "Metric name to summarize."
              window_seconds:
                type: "integer"
                minimum: 1
                maximum: 3600
                description: "Lookback window in seconds."
            required:
              - "metric"

      - type: "function"
        function:
          name: "get_action_history"
          description: >
            Query historical adaptation actions from Polaris knowledge store.
          parameters:
            type: "object"
            properties:
              window_seconds:
                type: "integer"
                minimum: 1
                maximum: 2592000
                description: "Lookback window in seconds."
              limit:
                type: "integer"
                minimum: 1
                maximum: 500
                description: "Maximum number of actions to return."

      - type: "function"
        function:
          name: "start_mission"
          description: >
            Request the SUAVE mission start through /task/request.
            Use this first when mission_running is 0, before any mode changes.
          parameters:
            type: "object"
            properties:
              task:
                type: "string"
                enum:
                  - "search_pipeline"
                  - "inspect_pipeline"
                description: "The SUAVE task to request."
              reasoning:
                type: "string"
                description: "Brief explanation of why the mission is being started."
            required:
              - "task"
              - "reasoning"

      - type: "function"
        function:
          name: "change_mode"
          description: >
            Change the operating mode of a SUAVE function node.
            Use when: thruster failure is detected (f_maintain_motion → fd_recover_thrusters),
            water visibility has clearly entered a new band (f_generate_search_path → spiral mode),
            or the mission needs to be started.
          parameters:
            type: "object"
            properties:
              function_node:
                type: "string"
                enum:
                  - "f_maintain_motion"
                  - "f_generate_search_path"
                  - "f_follow_pipeline"
                description: "The SUAVE function node whose mode should be changed."
              mode:
                type: "string"
                enum:
                  - "fd_all_thrusters"
                  - "fd_recover_thrusters"
                  - "fd_spiral_low"
                  - "fd_spiral_medium"
                  - "fd_spiral_high"
                  - "fd_follow_pipeline"
                description: "The target mode for the function node."
              reasoning:
                type: "string"
                description: "Brief explanation of why this mode change is being made."
            required:
              - "function_node"
              - "mode"
              - "reasoning"

      - type: "function"
        function:
          name: "no_adaptation"
          description: >
            Signal that no adaptation is needed this cycle. Call this when all
            function nodes are already in the correct modes for current conditions,
            or when the recent action history shows the last adaptation already resolved the issue.
          parameters:
            type: "object"
            properties:
              reasoning:
                type: "string"
                description: "Brief explanation of why no changes are needed."
            required:
              - "reasoning"

    resilience:
      rps: 1
      burst: 4
      max_retries: 3
      base_backoff_ms: 200
      max_backoff_ms: 3000

world_model:
  type: "statistical"
  statistical:
    window_size: 120
    use_kalman: true

knowledge_store:
  type: "memory"
  memory:
    max_states_per_system: 2000

meta_learner:
  enabled: true
  type: "llm"
  analysis_interval_hours: 0.017

  transparency:
    enabled: true
    output_path: "./logs/suave_meta_learning.jsonl"

  llm:
    provider: "groq"
    temperature: 0.1
    auto_apply: true

    per_system_prompts:
      suave:
        analysis_system_prompt: |
          You are analysing SUAVE performance for a self-adaptive Polaris controller.
          Mission target: search_time < 100 s mean and distance_inspected > 55 m mean.

          You will receive:
          - Rolling window metric summaries (averages per window)
          - Overall metric trends (INCREASING / DECREASING / STABLE with % change)
          - Recent adaptation actions and their outcomes
          - Current adaptation success rate

          Assess:
          1. Is the mission completing faster than the Metacontrol baseline (search_time_mean=106.95s)?
          2. Is the inspection coverage improving beyond the Metacontrol baseline (distance_inspected_mean=51.15m)?
          3. Are startup, thruster recovery, and spiral-mode changes happening at the right times?
          4. Is the cooldown too long (causing slow reactions) or too short (causing oscillation)?
          5. Is the LLM temperature producing deterministic or erratic decisions?

          Reply in JSON:
          {
            "analysis": "<2-3 sentences citing specific metric values and trends>",
            "issues": ["<issue 1 with metric evidence>", "<issue 2>"],
            "recommendations": ["<specific param + direction, e.g. reduce strategy_0.cooldown_seconds because...>"]
          }

        optimization_system_prompt: |
          You are optimising a Polaris agentic LLM strategy for SUAVE.
          Mission target: search_time < 100 s mean and distance_inspected > 55 m mean.

          TUNABLE PARAMETERS — use exact paths, stay strictly within min/max:

          strategy.params.temperature               float  0.0 – 2.0        (current: 0.2)
          strategy.params.steps_limit               int    1 – 10           (current: 3)
          strategy.params.decision_cooldown_seconds  float  0.0 – 3600.0     (current: 20.0)

          RULES:
          - Only propose changes that are clearly justified by the analysis data.
          - Keep each change < 20% of the current value.
          - For all parameters, confidence >= 0.80 is sufficient.
          - If the system is performing well, return {"proposals": []}.
          - Propose at most 2 changes per run.

          Reply ONLY as JSON with no markdown:
          {
            "proposals": [
              {
                "parameter": "<exact path from table above>",
                "proposed_value": <number or string>,
                "rationale": "<at least 30 words citing specific metric values from the analysis>",
                "confidence": <0.0-1.0>,
                "expected_impact": "<brief description>"
              }
            ]
          }

observability:
  logging:
    type: "human"
    level: "DEBUG"
    console: true
    file: true
    file_path: "./logs/suave_polaris.log"
    use_colors: true
  metrics:
    enabled: true
    collector_type: "simple"
    export:
      enabled: true
      formats:
        - json
        - csv
      output_dir: "./metrics/suave"
      auto_export_interval_minutes: 2
      experiment_name: "suave_polaris_run"
      include_timestamp: true
    simple:
      histogram_max_values: 2000
    components:
      core_framework: true
      monitoring_loop: true
      event_bus: true
      registry: true
      strategy: true
      connectors: true
      world_model: true
      knowledge_store: true
      meta_learner: true
